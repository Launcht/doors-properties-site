name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Base path comes from the repo variable so ONE workflow serves both
      # deployments: the preview repo sets VITE_BASE=/doors-website-preview/,
      # the live repo leaves it unset and vite.config falls back to "/".
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
      # SPA fallback so deep links resolve on a static host. 404.html catches
      # anything unknown, but it answers with a 404 STATUS, which is right for a
      # genuine miss and wrong for a real route - Google will not index a 404, and
      # /legal and /register are both in the sitemap. So give every real route its
      # own index.html and let it answer 200.
      - run: cp dist/index.html dist/404.html
      - name: Real routes answer 200, not 404
        run: |
          for route in legal register signin portal studio; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      # Custom domain, LIVE REPO ONLY. The live repo leaves VITE_BASE unset; the
      # preview repo sets it, and must NOT claim the domain or the two Pages sites
      # fight over it. This is why the CNAME is generated here rather than kept in
      # public/, which would ship it to both.
      - name: Claim the custom domain (live deploy only)
        if: ${{ vars.VITE_BASE == '' }}
        run: echo 'www.doors-properties.com' > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
